name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Set package version from tag
        run: uv version --frozen "${GITHUB_REF_NAME#v}"

      - name: Run tests
        run: uv run --frozen pytest

      - name: Build sdist and wheel
        run: uv build

      - name: Check package metadata
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/bacnet-ip-rest-client
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Uses PyPI Trusted Publishing (OIDC) -- no API token required. Before the first
      # release, register this repo as a *pending* publisher (the project doesn't exist on
      # PyPI yet) at https://pypi.org/manage/account/publishing/ with:
      #   PyPI project name: bacnet-ip-rest-client
      #   Owner: stblassitude   Repository: bacnet-ip-rest-client
      #   Workflow name: publish.yml   Environment name: pypi
      - uses: pypa/gh-action-pypi-publish@release/v1

  commit-version:
    name: Commit version to main
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so this doesn't start CI.
      - name: Commit version from tag
        run: |
          uv version --no-sync "${GITHUB_REF_NAME#v}"
          if git diff --quiet; then
            echo "pyproject.toml already has version ${GITHUB_REF_NAME#v}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Set version to ${GITHUB_REF_NAME#v}"
          git push origin main
